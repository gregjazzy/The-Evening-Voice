[build]
  command = "npm install --include=dev && echo '--- DEBUG: checking stripe ---' && ls node_modules/stripe/package.json && node -e \"console.log('stripe version:', require('stripe/package.json').version)\" && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22.13.1"
  NPM_FLAGS = "--include=dev"

[[plugins]]
  package = "@netlify/plugin-nextjs"
